name: Run Pytest on Pull Requests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Several boto3 clients are constructed at call time with no
      # explicit region; setting both region env vars removes any doubt,
      # matching the pattern already used in cloud_foundry's CI.
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          # Published fixture_foundry (0.2.4) has a real bug in its
          # container_network/postgres/localstack pytest fixtures (each
          # passes an unsupported teardown= kwarg into its own context
          # manager -- TypeError at fixture setup). Fixed upstream but not
          # yet released to PyPI: DanRepik/fixture_foundry#4. Not declared
          # in pyproject.toml as a git dependency -- PyPI rejects any
          # package whose metadata has a direct URL/VCS dependency, even
          # in an optional extra (see DanRepik/cloud_foundry#11) -- so it's
          # installed here as a separate step instead.
          #
          # Pinned to a commit SHA rather than the branch name: fetching a
          # mutable ref here would let a force-push or later change to that
          # branch silently alter what every PR's test run executes.
          pip install --force-reinstall --no-deps git+https://github.com/DanRepik/fixture_foundry.git@4a6b081452dd7c1aa72a40c9e1a107c346f8ff7e

      - name: Run pytest
        run: pytest tests
